[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrayrecon"
version = "0.1.0"
description = "X-ray reconstruction tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "imutils>=0.5.4",
    "numpy<2",
    "opencv-python-headless<5",
    "pandas<2",
    "pygerber>=2.4.3",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.14.0",
    "s3a>=0.7.0",
    "scipy>=1.15.3",
    "setuptools<81",
    "tqdm>=4.70.1",
]

[tool.hatch.build.targets.wheel]
packages = ["xrayrecon/xrayrecon"]
