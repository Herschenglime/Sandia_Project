[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandia-xrayrecon"
version = "0.1.0"
description = "PCB X-ray CT reconstruction, Gerber registration, and layer segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PyQt5>=5.15",
    "PyOpenGL",
    "pyqtgraph>=0.13",
    "qtextras",
    "s3a",
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "scikit-image",
    "opencv-python-headless<5",
    "pandas<2",
    "matplotlib",
    "Pillow",
    "pygerber",
    "tifffile",
    "fire",
    "imutils",
    "tqdm",
    "setuptools<81",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
# CUDA execution requires a CUDA-enabled PyTorch build and a working driver.
# CPU-only installations do not need this extra or a system CUDA compiler.
cuda = ["torch>=2.3"]
# Optional speedups for PyOpenGL rendering.
speed = ["pyopengl-accelerate"]

[tool.setuptools]
package-dir = {"" = "xrayrecon"}

[tool.setuptools.packages.find]
where = ["xrayrecon"]
include = ["xrayrecon*"]

[tool.setuptools.package-data]
xrayrecon = ["cuda_backprojection.cu"]

[tool.pytest.ini_options]
testpaths = ["xrayrecon/xrayrecon/tests"]
addopts = "-ra"
markers = [
    "unit: fast tests of pure computation and state",
    "integration: tests spanning multiple application components",
    "gui: headless Qt interaction tests",
    "slow: tests intentionally excluded from the fast development loop",
    "cuda: requires optional PyTorch and a working CUDA device",
]
filterwarnings = [
    "error::RuntimeWarning:xrayrecon\\..*",
    "error::FutureWarning:xrayrecon\\..*",
]

[tool.uv]
# pyqt5-qt5 5.15.3+ ships no Windows wheels; make the lock pick a version that
# installs on Windows as well as Linux and macOS.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# The CUDA build of torch for the optional `cuda` extra on Windows; PyPI only
# carries the CPU build there. cu130 matches CUDA 13 drivers.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
